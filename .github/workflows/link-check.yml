name: Markdown Link Validator

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check links with lychee
        # See https://github.com/lycheeverse/lychee-action
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --max-concurrency 20
            --accept "100..=103,200..=299,429,500..=599"
            --max-retries 5
            --retry-wait-time 10
            --exclude-path "docs/get_started/legacy_licenses/"
            --exclude-link-local
            --exclude "https://doi.org/"
            --exclude "https://pubs.aip.org"
            --exclude "https://www.gnu.org"
            --exclude "https://fsf.org"
            --exclude "http://www.k-wave.org"
            --exclude "https://openincolab.com"
            --exclude "https://nightly.link/waltsims/k-wave-python/"
            "**/*.md" "**/*.rst"
          fail: true
        env:
          # authenticated requests to github.com links get a much higher rate limit
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
